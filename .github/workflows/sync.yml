name: Synchronisation Calendrier NEOMA

on:
  schedule:
    # S'exécute automatiquement toutes les 4 heures
    - cron: '0 */4 * * *'
  # Permet aussi de déclencher la mise à jour manuellement si besoin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Télécharger et convertir le planning
        run: python update_calendar.py

      - name: Sauvegarder le fichier planning.ics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add planning.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique du planning" && git push)
